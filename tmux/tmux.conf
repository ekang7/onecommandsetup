# --- Prefix: Option-w (Meta-w) ---
unbind C-b
set -g prefix M-w
bind M-w send-prefix

# --- General ---
set -g mouse on
set -sg escape-time 0
set -g history-limit 500000
set -g set-clipboard on
set -g allow-passthrough on

# --- Splits keep current working dir ---
bind '"' split-window -v -c "#{pane_current_path}"
bind %  split-window -h -c "#{pane_current_path}"

# --- Copy-mode: vi keys ---
setw -g mode-keys vi

# --- Mouse behavior ---
# 1) Scroll wheel:
#    - If tmux/app mode is already handling mouse input, pass it through
#    - Otherwise, require two wheel-up ticks within 0.20s before entering copy-mode
bind-key -n WheelUpPane   if -F "#{||:#{mouse_any_flag},#{pane_in_mode}}" "send-keys -M" "if -F \"#{@wheel_up_pending}\" \"set -p -t= @wheel_up_pending 0; copy-mode -e; send-keys -M\" \"select-pane -t=; set -p -t= @wheel_up_pending 1; run-shell -b -d 0.20 -C \\\"set -p -t #{mouse_pane} @wheel_up_pending 0\\\"\""
bind-key -n WheelDownPane send-keys -M

# 2) Click:
#    IMPORTANT: click should ONLY focus the pane (not enter copy-mode)
bind-key -n MouseDown1Pane select-pane -t= \; send-keys -M

# 3) Click+drag:
#    Enter copy-mode and start selecting (drag-to-select)
bind-key -n MouseDrag1Pane select-pane -t= \; copy-mode -e \; send-keys -M

# 4) When you finish a drag (or press Enter / y), copy to macOS clipboard and exit copy-mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter            send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y                send-keys -X copy-pipe-and-cancel "pbcopy"

# 5) Vim-style selection controls inside copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# --- Pane titles ---
# Show pane titles at the top of each pane border.
# Prefer the user-set @title (sticky) and fall back to #T (app-set, may change).
set -g pane-border-status top
set -g pane-border-format " #{pane_index} | #{?#{@title},#{@title},#T} "

# Rename current pane: prefix + ,
# Stores into a per-pane user option so apps that send OSC titles can't overwrite it.
bind , command-prompt -p "Pane title:" "set -p @title '%%'"
